---
- name: Cai dat va cau hinh Nginx
  hosts: web
  become: true
  vars:
    server_name: "landing-page.local"
  tasks:
    - name: Cai goi nginx
      ansible.builtin.package:
        name: nginx
        state: present
    - name: Copy file cau hinh tu template
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/conf.d/default.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart nginx
    - name: Dam bao nginx dang chay va bat khi khoi dong
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted