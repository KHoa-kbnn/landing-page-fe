- hosts: web1
  become: yes
  vars:
    server_name: "landing-page.local"
  tasks:
    - name: Cai goi nginx
      apt:
        name: nginx
        state: present
        update_cache: yes
    # ... các task phía dưới giữ nguyên

    - name: Copy file cau hinh tu template
      template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/conf.d/default.conf
      notify: Restart nginx

    - name: Copy ma nguon frontend vao thu muc web
      copy:
        src: ../dist/
        dest: /var/www/html/
        owner: www-data
        group: www-data
        mode: '0755'

  handlers:
    - name: Restart nginx
      service:
        name: nginx
        state: restarted