name: Thử nghiệm Đóng gói (CI Build)

on:
  push:
    branches:
      - main

jobs:
  build_va_dong_goi:
    name: Kiểm tra và Đóng gói mã nguồn
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Tải mã nguồn mới nhất
        uses: actions/checkout@v4

      - name: 2. Kiểm tra cấu trúc thư mục
        run: |
          echo "Danh sách các file trong dự án hiện tại:"
          ls -la

      - name: 3. Thử nghiệm Build Docker Compose
        run: |
          echo "Tiến hành build thử các container để quét lỗi..."
          docker compose build
          echo "Build thành công! Cấu hình FE và BE hoàn toàn hợp lệ."

      - name: 4. Lưu trữ thành phẩm (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: fullstack-package
          path: ./*
          retention-days: 7
